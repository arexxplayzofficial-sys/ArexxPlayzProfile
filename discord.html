<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discord Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Poppins,sans-serif;
    background:#171718;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:#fff;
}

.card{
    width:420px;
    background:#111010;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.45);
}

.banner{
    height:150px;
    background:linear-gradient(135deg,#e1e2eb,#8B5CF6);
}

.content{
    text-align:center;
    padding:0 30px 35px;
}

.avatar{
    width:140px;
    height:140px;
    margin-top:-70px;
    border-radius:50%;
    object-fit:cover;
    border:6px solid #0084ff;
}

.name{
    font-size:30px;
    margin-top:18px;
}

.username{
    color:#B5BAC1;
    margin-top:6px;
}

.status{
    color:#57F287;
    margin-top:12px;
    font-weight:600;
}

.bio{
    margin-top:20px;
    color:#DBDEE1;
    line-height:1.7;
}

.badges{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:25px;
    flex-wrap:wrap;
}

.badge{
    background:#5865F2;
    padding:8px 14px;
    border-radius:50px;
    font-size:14px;
}

.buttons{
    margin-top:30px;
}

.buttons a{
    display:inline-block;
    margin:8px;
    padding:14px 28px;
    border-radius:50px;
    text-decoration:none;
    font-weight:600;
    transition:.3s;
}

.join{
    background:#5865F2;
    color:white;
}

.profile{
    background:#000000;
    color:white;
}

.buttons a:hover{
    transform:translateY(-4px);
}

</style>

</head>

<body>

<div class="card">

    <div  class="banner">
        <img src="boy eye.jpg" width="450" height="150">

    </div>

    <div class="content">

        <img src="662662532709290508.jpg"
             class="avatar"
             alt="Profile">

        <h2 class="name">Arexx Playz</h2>

        <p class="username">@arexx_playz</p>

        <p class="status">
            🟢 Online
        </p>

        <p class="bio">
            Minecraft • Gamer • Web Designer  
        </p>


           <div class="badges"></div>

          <span class="badge">
                <i class="fa-solid fa-code"></i>
                Web Designer
            </span>
            <div>


            <div class="badges"></div>

            <span class="badge">
                <i class="fa-solid fa-gamepad"></i>
                Gamer
            </span>
            <div>

        </div>

        <div class="buttons">

        </div>

    </div>

</div>

</body>
</html>
